version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamoid
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/streamoid
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  db-data:
